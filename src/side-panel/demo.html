<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>Side Panel 演示</title>
</head>

<body>
    <h1>Side Panel 模块演示</h1>
    <p>Dify面板将直接显示在下方：</p>

    <div id="root" style="width: 100%; height: 80vh; border: 1px solid #ccc; border-radius: 8px; overflow: hidden;">
        <!-- Dify面板将在这里显示 -->
    </div>

    <script>
        // 页面加载完成后直接显示Dify面板
        window.addEventListener('load', function () {
            const iframe = document.createElement('iframe');
            iframe.src = 'https://udify.app/chatbot/KzC2LHFnK6rLa0nA';
            iframe.style.cssText = 'border: none; width: 100%; height: 100%; border-radius: 8px;';
            iframe.id = 'dify-chatbot-bubble-window';

            const container = document.getElementById('root');
            if (container) {
                container.appendChild(iframe);
            }
        });
    </script>
</body>

</html>
